# Training curriculum for the room-aware duplex model (PLAN.md §5).
# Each stage names its data mix, objective, gate metric and the harness that scores it.

model:
  backbone: {init: "kyutai/moshiko-pytorch-bf16 (Helium 7B, 32L/4096d) + 6L/1024d depth transformer", d_model: 4096, layers: 32}
  serialization: moshi   # 17 streams/step; acoustic delay 2 (pretrain) -> 1 (post); text delay 0 - do not change
  conditioning_ablation: [additive_input, fddt_per_layer_suppressive_init]   # QKb dropped (hallucinates at init)
  codec: kyutai/mimi            # 12.5 Hz = Sortformer frame rate; 8 codebooks
  slots: 4                      # raise to 8 with an 8-spk diarizer
  conditioning: research/conditioning.py::DiarizationConditioning
  identity_dim: 192             # TitaNet-large

corruption:                     # applied to every training mask, PLAN.md §4.4
  jitter_frames: 3
  flip_p: 0.05
  swap_p: 0.02
  max_lag: 12
  late_onset_p: 0.3       # drop the first 0.3-1.0 s of a turn's activity (Sortformer's dominant error)
  short_turn_drop_p: 0.2  # drop turns < 0.6 s entirely

stages:
  - name: 0_init
    goal: pick backbone init; verify Mimi round-trip and frame alignment with Sortformer
    gate: "1B ablation: conditioned < unconditioned cpWER on simulated rooms by >= 20% relative"

  - name: 1_room_listening
    data: {real_pseudolabelled: 20000h, simulated_rooms: 100000h}
    objective: next-token on room audio + speaker-attributed inner monologue (SOT with <spk:NAME> tags)
    inputs: [room_codes, activity, identity(unknown)]
    outputs: [text]
    gate: {cpWER_AMI_test: "<= Dixtral (BUT-FIT/Dixtral) with Sortformer masks", cpWER_NOTSOFAR: "<= Dixtral"}
    harness: bench/ami_bench.py   # same references, same cpWER
    compute_h100_hours: "2700-22600 (data-derived, docs/research/infra.md §3)"

  - name: 2_identity
    data: {simulated_rooms_named: 30000h, real_with_profiles: 5000h}
    objective: stage-1 + names bound to identity embeddings; enrollment given as prompt
    gate: {idWER_minus_cpWER_AMI: "<= 1.0 point"}
    compute_h100_hours: "1000-3000"

  - name: 3_duplex_behaviour
    data: {assistant_in_room_synthetic: 10000h}
    objective: add own audio stream + floor token; research/duplex_lm.py::loss
    gate: {notsofar_turntaking_f1: ">= 0.76 (ModeratorLM)", fdb_v15_talking_to_others: "Unknown-rate < 20%", speech_mos: ">= 4.0"}
    compute_h100_hours: "3000-10000"

  - name: 4_rl_timing
    data: {assistant_in_room_human: 500h, preferences: "rater labels welcome/late/rude"}
    objective: DuplexPO-style windowed factorised reward (onset gaussian, backchannel proximity, yield penalty, participation regulariser) + addressed-to-agent mask
    gate: {onset_mae_s: "<= 0.7", vir: "<= stage3", win_rate_vs_stage3: ">= 0.65"}
    compute_h100_hours: "1000-3000"

  - name: 5_distil
    data: all
    objective: 1-2B student, sequence-level KD from stage-4 teacher
    gate: {cpWER_delta: "<= +2.0", rtf_m_series: "< 0.5"}
    compute_h100_hours: "1000-4000"
