# Stage-1 "room listening" pilot on Moshi with LoRA + diarization conditioning (PLAN.md §8 job 6).
# Consumed by research/moshi_finetune_repo/train_pilot.py (generated by research/pilot/build_trainer.py).
# Paths are Modal-volume paths; research/modal_app.py::pilot_stage1 fills run_dir per segment.

data:
  train_data: "/data/pilot/rooms/data.jsonl:3,/data/pilot/ami/data.jsonl:1"   # simulated rooms 3 : real meetings 1
  eval_data: "/data/pilot/ami_dev/data.jsonl"
  shuffle: true

moshi_paths:
  hf_repo_id: "kyutai/moshiko-pytorch-bf16"

full_finetuning: false
lora:
  enable: true
  rank: 64
  scaling: 2.
  ft_embed: false

# Moshi's own audio stream is silence in stage 1; keep its loss from dominating the text stream.
first_codebook_weight_multiplier: 1.
text_padding_weight: .5

duration_sec: 100            # 1250 frames per example
batch_size: 4                # 4 x 100 s on one H100 with gradient checkpointing (upstream: 16 x 100 s fits in 39.6 GB)
max_steps: 1000              # per segment; modal_app.py chains segments
gradient_checkpointing: true
optim:
  lr: 2e-5                   # 10x upstream's 2e-6: LoRA + a fresh conditioning module
  weight_decay: 0.1
  pct_start: 0.05

seed: 0
log_freq: 10
eval_freq: 250
do_eval: true
do_ckpt: true
ckpt_freq: 250
num_ckpt_keep: 2
save_adapters: false         # merged consolidated checkpoint -> next segment's PILOT_INIT_MOSHI

run_dir: ""                  # set by the Modal job
